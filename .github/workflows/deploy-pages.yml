name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  container-api-docs:
    name: Build Container API Documentation
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Check out container-engine-api
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/container-engine-api
          ref: main
          path: sources/container-engine-api

      - name: Check out container
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/container
          ref: main
          path: sources/container

      - name: Check out containerization
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/containerization
          ref: main
          path: sources/containerization

      - name: Check out swift-nio-ssl
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/swift-nio-ssl
          ref: main
          path: sources/swift-nio-ssl

      - name: Check out container-k8s
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/container-k8s
          ref: main
          path: sources/container-k8s

      - name: Check out container-builder-shim
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/container-builder-shim
          ref: main
          path: sources/container-builder-shim

      - name: Check out container-compose
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/container-compose
          ref: main
          path: sources/container-compose

      - name: Check out devcontainer
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/devcontainer
          ref: main
          path: sources/devcontainer

      - name: Build container API collection
        run: |
          scripts/build-container-api-docs.sh \
            "${RUNNER_TEMP}/container-api" \
            "${GITHUB_WORKSPACE}/sources/container-engine-api" \
            "${GITHUB_WORKSPACE}/sources/container" \
            "${GITHUB_WORKSPACE}/sources/containerization" \
            "${GITHUB_WORKSPACE}/sources/container-k8s" \
            "${GITHUB_WORKSPACE}/sources/container-builder-shim" \
            "${GITHUB_WORKSPACE}/sources/container-compose" \
            "${GITHUB_WORKSPACE}/sources/devcontainer" \
            "${GITHUB_WORKSPACE}/sources/swift-nio-ssl"

      - name: Archive container API collection
        run: tar -czf "${RUNNER_TEMP}/container-api-docs.tgz" -C "${RUNNER_TEMP}/container-api" .

      - name: Upload container API artifact
        uses: actions/upload-artifact@v7
        with:
          name: container-api-docs
          path: ${{ runner.temp }}/container-api-docs.tgz
          retention-days: 1

  project-docs:
    name: Build Swift Project Documentation
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Check out Asteroids
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/asteroids
          ref: main
          path: sources/asteroids
          ssh-key: ${{ secrets.ASTEROIDS_DOCS_DEPLOY_KEY }}

      - name: Check out BZFlag Swift
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/bzflag-swift
          ref: main
          path: sources/bzflag-swift

      - name: Check out BZFlag
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/bzflag
          ref: main
          path: sources/bzflag

      - name: Check out Galaxians
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/galaxians
          ref: main
          path: sources/galaxians
          ssh-key: ${{ secrets.GALAXIANS_DOCS_DEPLOY_KEY }}

      - name: Check out Mac Sync
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/mac-sync
          ref: main
          path: sources/mac-sync

      - name: Check out My Time Buddy
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/mytimebuddy
          ref: main
          path: sources/mytimebuddy

      - name: Check out Maze
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/maze
          ref: main
          path: sources/maze

      - name: Check out Mazewar
        uses: actions/checkout@v7
        with:
          repository: stephenlclarke/mazewar
          ref: main
          path: sources/mazewar

      - name: Build project documentation
        run: |
          scripts/build-project-docs.sh \
            "${RUNNER_TEMP}/project-docs" \
            "${GITHUB_WORKSPACE}/sources/asteroids" \
            "${GITHUB_WORKSPACE}/sources/bzflag" \
            "${GITHUB_WORKSPACE}/sources/bzflag-swift" \
            "${GITHUB_WORKSPACE}/sources/galaxians" \
            "${GITHUB_WORKSPACE}/sources/mac-sync" \
            "${GITHUB_WORKSPACE}/sources/maze" \
            "${GITHUB_WORKSPACE}/sources/mazewar" \
            "${GITHUB_WORKSPACE}/sources/mytimebuddy"

      - name: Archive project documentation
        run: tar -czf "${RUNNER_TEMP}/project-docs.tgz" -C "${RUNNER_TEMP}/project-docs" .

      - name: Upload project documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: project-docs
          path: ${{ runner.temp }}/project-docs.tgz
          retention-days: 1

  build:
    needs:
      - container-api-docs
      - project-docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate site
        run: make test

      - name: Build static site
        run: make build

      - name: Download container API documentation
        uses: actions/download-artifact@v8
        with:
          name: container-api-docs
          path: ${{ runner.temp }}

      - name: Add container API documentation
        run: tar -xzf "${RUNNER_TEMP}/container-api-docs.tgz" -C _site/api

      - name: Download project documentation
        uses: actions/download-artifact@v8
        with:
          name: project-docs
          path: ${{ runner.temp }}

      - name: Add project documentation
        run: tar -xzf "${RUNNER_TEMP}/project-docs.tgz" -C _site/projects

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
